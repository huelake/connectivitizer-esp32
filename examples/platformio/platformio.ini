; A PlatformIO project around the same sketch as the Arduino examples, with the things you
; change kept in include/secrets.h (not committed). See README.md in this folder.
;
;   pio run -e esp32dev -t upload -t monitor
;
; Pick the environment that matches your board; add your own board the same way.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The library is the folder two levels up. In your own project: lib_deps = huelakesoftwaresolutions/Connectivitizer
lib_deps = symlink://../..

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1

[env:esp32-c3]
board = esp32-c3-devkitm-1

[env:esp32-s2]
board = esp32-s2-saola-1
